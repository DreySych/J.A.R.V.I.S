<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NCS Visualizer</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #050505;
    }

    #bg-layer {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: url('media/colors.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-color: rgba(0, 0, 0, 0.6);
      background-blend-mode: overlay;
      opacity: 1;
      transition: opacity 1.5s ease-in-out;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 80vh;
      position: relative;
      z-index: 10;
    }

    .controls {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: min(90vw, 580px);
      z-index: 10;
    }

    button, .file-button, input {
      font-family: inherit;
    }

    button, .file-button {
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      background: rgba(10, 10, 15, 0.8);
      color: #fff;
      padding: 10px 18px;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: 0.2s;
    }

    button:hover, .file-button:hover {
      background: rgba(40, 40, 50, 0.9);
      border-color: rgba(255, 255, 255, 0.4);
    }

    input[type="file"] { display: none; }

    #status {
      width: 100%;
      text-align: center;
      color: #555;
      font-size: 12px;
      letter-spacing: 0.5px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div id="bg-layer"></div>

  <canvas id="c"></canvas>

  <div class="controls">
    <label class="file-button">
      Выбрать аудио
      <input id="fileInput" type="file" accept="audio/*">
    </label>
    <button id="playPauseBtn">Пауза / продолжить</button>
    <button id="rainbowBtn">Радуга</button>
    <span id="status">Demo режим (синтетический бас)</span>
  </div>

  <script type="module">
    import { NCSVisualizer } from './ncs-visualizer.js';

    const canvas = document.getElementById('c');
    const fileInput = document.getElementById('fileInput');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const statusEl = document.getElementById('status');

    const viz = new NCSVisualizer(canvas, {
      dotCount: 350,
    });

    viz.start();

    window.playAIResponse = function(base64Audio) {
      const byteCharacters = atob(base64Audio);
      const byteNumbers = new Array(byteCharacters.length);
      for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
      }
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], {type: 'audio/wav'});
      const url = URL.createObjectURL(blob);
      viz.playFromUrl(url);
    };

    fileInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      try {
        viz.loadAudio(file);
        viz.play();

        statusEl.textContent = "▶ " + file.name.replace(/\.[^/.]+$/, "");
        playPauseBtn.textContent = "Пауза";
      } catch (error) {
        console.error(error);
        statusEl.textContent = "Ошибка загрузки аудио";
      }
    });

    viz.setPulsationStrength(1.5);

    playPauseBtn.addEventListener('click', () => {
      if (!viz.hasAudio) {
        statusEl.textContent = "Сначала выберите аудиофайл";
        return;
      }

      viz.togglePlay();

      if (viz.isPlaying) {
        playPauseBtn.textContent = "Пауза";
      } else {
        playPauseBtn.textContent = "Продолжить";
      }
    });

    canvas.addEventListener('click', () => {
      if (viz.rainbowMode) {
        viz.setRainbowMode(false);
        document.getElementById('rainbowBtn').textContent = "Радуга";
      }
      const newcolor = NCSVisualizer.newColor();
      viz.setColor(...newcolor);
    });

    document.getElementById('rainbowBtn').addEventListener('click', () => {
      viz.setRainbowMode(!viz.rainbowMode);
      const btn = document.getElementById('rainbowBtn');
      btn.textContent = viz.rainbowMode ? "Выкл" : "Радуга";
    });

    window.screenGlow = function (enabled) {
        viz.setListening(enabled);
    };

    window.changeBackground = function(source, isColor = false) {
      const newBg = document.createElement('div');
      newBg.id = 'bg-layer-new';
      newBg.style.cssText = `
        position: fixed;
        inset: 0;
        z-index: -1;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        opacity: 0;
        transition: opacity 1.5s ease-in-out;
      `;

      if (isColor) {
        newBg.style.backgroundColor = source;
      } else {
        newBg.style.backgroundImage = `url('${source}')`;
        newBg.style.backgroundColor = 'rgba(0, 0, 0, 0.6)';
        newBg.style.backgroundBlendMode = 'overlay';
      }

      document.body.appendChild(newBg);
      void newBg.offsetWidth;
      newBg.style.opacity = '1';

      const oldBg = document.getElementById('bg-layer');
      if (oldBg) {
        oldBg.style.opacity = '0';
        setTimeout(() => oldBg.remove(), 1500);
      }

      setTimeout(() => { newBg.id = 'bg-layer'; }, 1500);
    };
  </script>
</body>
</html>
